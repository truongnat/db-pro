services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dbpro
      POSTGRES_PASSWORD: dbpro_test
      POSTGRES_DB: dbpro_fixture
    ports:
      - "5432:5432"
    volumes:
      - ./fixtures/postgres/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
      - ./fixtures/postgres/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbpro -d dbpro_fixture"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_data:
