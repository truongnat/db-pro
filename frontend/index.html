<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DB Pro</title>
    <script>
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem("db-pro-theme"));
          var theme = stored && stored.state && stored.state.mode;
          if (theme) document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
