<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DB Pro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0a2e 0%, #1e1b4b 50%, #1e3a5f 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .logo {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      object-fit: contain;
    }

    .app-name {
      font-size: 32px;
      font-weight: 700;
      color: #e0e7ff;
      letter-spacing: -0.5px;
    }

    .app-tagline {
      font-size: 13px;
      color: #818cf8;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: -8px;
    }

    .loader {
      margin-top: 48px;
      display: flex;
      gap: 8px;
    }

    .loader-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6366f1;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .loader-dot:nth-child(2) { animation-delay: 0.2s; }
    .loader-dot:nth-child(3) { animation-delay: 0.4s; }

    @media (prefers-reduced-motion: reduce) {
      .loader-dot { animation: none; }
    }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img class="logo" src="logo.png" alt="DB Pro" />
    <div class="app-name">DB Pro</div>
    <div class="app-tagline">Database Management</div>
  </div>
  <div class="loader">
    <div class="loader-dot"></div>
    <div class="loader-dot"></div>
    <div class="loader-dot"></div>
  </div>
</body>
</html>
