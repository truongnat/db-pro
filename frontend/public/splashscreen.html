<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DB Pro</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
        user-select: none;
      }

      .logo-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .logo-svg {
        width: 120px;
        height: 120px;
      }

      .app-name {
        font-size: 32px;
        font-weight: 700;
        color: #e0e7ff;
        letter-spacing: -0.5px;
      }

      .app-tagline {
        font-size: 13px;
        color: #818cf8;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-top: -8px;
      }

      .loader {
        margin-top: 48px;
        display: flex;
        gap: 8px;
      }

      .loader-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #6366f1;
        animation: pulse 1.4s ease-in-out infinite;
      }

      .loader-dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      .loader-dot:nth-child(3) {
        animation-delay: 0.4s;
      }

      @media (prefers-reduced-motion: reduce) {
        .loader-dot {
          animation: none;
        }
      }

      @keyframes pulse {
        0%,
        80%,
        100% {
          opacity: 0.3;
          transform: scale(0.8);
        }
        40% {
          opacity: 1;
          transform: scale(1.2);
        }
      }
    </style>
  </head>
  <body>
    <div class="logo-container">
      <svg class="logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
        <defs>
          <linearGradient
            id="dbGrad"
            x1="120"
            y1="130"
            x2="390"
            y2="390"
            gradientUnits="userSpaceOnUse"
          >
            <stop stop-color="#67E8F9" />
            <stop offset="0.45" stop-color="#3B82F6" />
            <stop offset="1" stop-color="#4F46E5" />
          </linearGradient>
          <linearGradient
            id="orbitGrad"
            x1="88"
            y1="350"
            x2="424"
            y2="160"
            gradientUnits="userSpaceOnUse"
          >
            <stop stop-color="#22D3EE" stop-opacity="0.18" />
            <stop offset="0.42" stop-color="#60A5FA" />
            <stop offset="0.78" stop-color="#818CF8" />
            <stop offset="1" stop-color="#67E8F9" />
          </linearGradient>
          <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="3.5" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>
        <ellipse
          cx="256"
          cy="260"
          rx="206"
          ry="94"
          transform="rotate(-17 256 260)"
          stroke="url(#orbitGrad)"
          stroke-width="9"
          stroke-linecap="round"
          opacity="0.92"
          filter="url(#softGlow)"
        />
        <ellipse
          cx="256"
          cy="260"
          rx="206"
          ry="94"
          transform="rotate(-17 256 260)"
          stroke="#BAE6FD"
          stroke-width="2"
          stroke-linecap="round"
          opacity="0.72"
        />
        <path
          fill-rule="evenodd"
          clip-rule="evenodd"
          d="M118 137H220C291 137 331 181 331 256C331 331 291 375 220 375H118V137ZM174 190V322H216C254 322 274 299 274 256C274 213 254 190 216 190H174Z"
          fill="url(#dbGrad)"
        />
        <path
          fill-rule="evenodd"
          clip-rule="evenodd"
          d="M241 137H329C385 137 414 162 414 205C414 234 400 254 373 265C407 274 424 298 424 332C424 360 413 381 391 395C374 406 353 411 327 411H241V137ZM296 187V244H326C349 244 360 234 360 215C360 196 349 187 326 187H296ZM296 291V360H331C356 360 369 349 369 326C369 303 356 291 331 291H296Z"
          fill="url(#dbGrad)"
          opacity="0.96"
        />
        <path
          d="M208 349L264 318"
          stroke="#A5F3FC"
          stroke-width="8"
          stroke-linecap="round"
          opacity="0.82"
        />
        <g transform="translate(409 153)" filter="url(#glow)">
          <path d="M0-22C2-8 8-2 22 0C8 2 2 8 0 22C-2 8-8 2-22 0C-8-2-2-8 0-22Z" fill="#E0F2FE" />
          <circle r="4.5" fill="#67E8F9" />
        </g>
        <circle cx="91" cy="306" r="4" fill="#38BDF8" opacity="0.72" />
        <circle cx="126" cy="157" r="3" fill="#818CF8" opacity="0.6" />
        <circle cx="432" cy="286" r="3" fill="#67E8F9" opacity="0.7" />
      </svg>
      <div class="app-name">DB Pro</div>
      <div class="app-tagline">Database Management</div>
    </div>
    <div class="loader">
      <div class="loader-dot"></div>
      <div class="loader-dot"></div>
      <div class="loader-dot"></div>
    </div>
  </body>
</html>
