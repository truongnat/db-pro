name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dbpro
          POSTGRES_PASSWORD: dbpro_test
          POSTGRES_DB: dbpro_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://dbpro:dbpro_test@localhost:5432/dbpro_fixture

    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Load PostgreSQL fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          PGPASSWORD=dbpro_test psql -v ON_ERROR_STOP=1 -h localhost -U dbpro -d dbpro_fixture -f fixtures/postgres/001_schema.sql
          PGPASSWORD=dbpro_test psql -v ON_ERROR_STOP=1 -h localhost -U dbpro -d dbpro_fixture -f fixtures/postgres/002_seed.sql
          PGPASSWORD=dbpro_test psql -v ON_ERROR_STOP=1 -h localhost -U dbpro -d dbpro_fixture -f fixtures/postgres/003_verify.sql

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all -- -D warnings

      - name: cargo build
        run: cargo build

      - name: cargo test
        run: cargo test --all -- --include-ignored

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: tsc --noEmit
        run: pnpm run typecheck
        working-directory: frontend

      - name: eslint
        run: pnpm run lint
        working-directory: frontend

      - name: prettier
        run: pnpm run format:check
        working-directory: frontend

      - name: token contract
        run: pnpm run check:tokens
        working-directory: frontend

      - name: build
        run: pnpm run build
        working-directory: frontend

      - name: test
        run: pnpm run test
        working-directory: frontend
