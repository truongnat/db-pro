name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dbpro
          POSTGRES_PASSWORD: dbpro_test
          POSTGRES_DB: dbpro_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://dbpro:dbpro_test@localhost:5432/dbpro_fixture

    steps:
      - uses: actions/checkout@v4

      # egui/eframe (crates/ui, crates/native-app) needs the GL/X11/Wayland
      # development headers. The WebKit/GTK headers are still required because
      # the transitional Tauri host (crates/tauri-app) remains a workspace member.
      # See _archive/README.md and docs/10-egui-native-migration-plan.md.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Load PostgreSQL fixtures
        run: |
          sudo apt-get install -y postgresql-client
          PGPASSWORD=dbpro_test psql -v ON_ERROR_STOP=1 -h localhost -U dbpro -d dbpro_fixture -f fixtures/postgres/001_schema.sql
          PGPASSWORD=dbpro_test psql -v ON_ERROR_STOP=1 -h localhost -U dbpro -d dbpro_fixture -f fixtures/postgres/002_seed.sql
          PGPASSWORD=dbpro_test psql -v ON_ERROR_STOP=1 -h localhost -U dbpro -d dbpro_fixture -f fixtures/postgres/003_verify.sql

      - name: Configure live SSH backup fixture
        run: |
          ssh_dir="$RUNNER_TEMP/db-pro-ssh"
          ssh_user="$(whoami)"
          ssh_port="$(python3 -c 'import socket; s=socket.socket(); s.bind((\"127.0.0.1\", 0)); print(s.getsockname()[1]); s.close()')"
          mkdir -p "$ssh_dir" "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keygen -q -t ed25519 -N '' -f "$ssh_dir/user_key"
          ssh-keygen -q -t ed25519 -N '' -f "$ssh_dir/host_key"
          cp "$ssh_dir/user_key.pub" "$ssh_dir/authorized_keys"
          chmod 600 "$ssh_dir/user_key" "$ssh_dir/authorized_keys"
          /usr/sbin/sshd -D -e -f /dev/null -p "$ssh_port" -h "$ssh_dir/host_key" \
            -o "AuthorizedKeysFile=$ssh_dir/authorized_keys" \
            -o StrictModes=no -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o PubkeyAuthentication=yes \
            -o UsePAM=no -o PermitRootLogin=no -o "AllowUsers=$ssh_user" \
            -o "PidFile=$ssh_dir/sshd.pid" >"$ssh_dir/sshd.log" 2>&1 &
          sshd_pid=$!
          echo "DB_PRO_SSHD_PID=$sshd_pid" >> "$GITHUB_ENV"
          for _ in $(seq 1 50); do
            if nc -z 127.0.0.1 "$ssh_port" >/dev/null 2>&1; then break; fi
            if ! kill -0 "$sshd_pid" 2>/dev/null; then
              sed -n '1,120p' "$ssh_dir/sshd.log"
              exit 1
            fi
            sleep 0.1
          done
          nc -z 127.0.0.1 "$ssh_port"
          ssh-keyscan -p "$ssh_port" 127.0.0.1 >> "$HOME/.ssh/known_hosts" 2>/dev/null
          {
            echo "DB_PRO_SSH_HOST=127.0.0.1"
            echo "DB_PRO_SSH_PORT=$ssh_port"
            echo "DB_PRO_SSH_USER=$ssh_user"
            echo "DB_PRO_SSH_KEY=$ssh_dir/user_key"
            echo "DB_PRO_SSH_TARGET_HOST=127.0.0.1"
            echo "DB_PRO_SSH_TARGET_PORT=5432"
            echo "DB_PRO_SSH_DATABASE=dbpro_fixture"
            echo "DB_PRO_SSH_USERNAME=dbpro"
            echo "DB_PRO_SSH_PASSWORD=dbpro_test"
          } >> "$GITHUB_ENV"

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all -- -D warnings

      - name: cargo build
        run: cargo build

      - name: cargo test
        run: cargo test --all -- --include-ignored

      - name: Stop live SSH backup fixture
        if: always()
        run: kill "${DB_PRO_SSHD_PID:-}" 2>/dev/null || true

      - name: cargo build native app (release)
        run: cargo build --release --locked -p db-pro-native

  # The legacy React/Vite frontend job was removed when the frontend was archived.
  # There is no Node/pnpm/TypeScript quality gate in this repository anymore.
  # Historical gates are recorded in _archive/README.md.
