name: Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  APP_NAME: "DB Pro"

jobs:
  # ── Pre-flight checks ───────────────────────────────────────────────
  preflight:
    name: Pre-flight checks
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.provenance.outputs.candidate_sha }}
      app_version: ${{ steps.provenance.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve exact candidate provenance
        id: provenance
        shell: bash
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$GITHUB_SHA" ]; then
            echo "Checkout SHA $actual_sha does not match GitHub event SHA $GITHUB_SHA" >&2
            exit 1
          fi

          app_version="$(python3 -c 'import json; print(json.load(open("crates/tauri-app/tauri.conf.json"))["version"])')"
          echo "candidate_sha=$actual_sha" >> "$GITHUB_OUTPUT"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"

          {
            echo "### Release candidate provenance"
            echo "- Version: \`$app_version\`"
            echo "- Exact SHA: \`$actual_sha\`"
            echo "- Event ref: \`$GITHUB_REF\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Node
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

      # Rust
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Record Rust toolchain
        run: rustc --version --verbose

      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # ── Build matrix ────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.platform }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-latest
          - platform: Windows
            runner: windows-latest
          - platform: Linux
            runner: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify build checkout provenance
        shell: bash
        env:
          EXPECTED_CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_CANDIDATE_SHA" ]; then
            echo "Build checkout SHA $actual_sha does not match preflight candidate $EXPECTED_CANDIDATE_SHA" >&2
            exit 1
          fi
          echo "Building exact candidate SHA: $actual_sha"

      # Node setup
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Rust setup
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Linux system deps
      - name: Install Linux system deps
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libfuse2

      # Frontend deps
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      # Tauri CLI
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "2.11.4" --locked --force

      # Build
      - name: Build Tauri app (Linux)
        if: matrix.platform == 'Linux'
        run: cargo tauri build --bundles deb,rpm

      - name: Build Tauri app (macOS/Windows)
        if: matrix.platform != 'Linux'
        run: cargo tauri build

      # Upload artifacts
      - name: Upload artifacts (macOS)
        if: matrix.platform == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: db-pro-macos-v${{ needs.preflight.outputs.app_version }}-${{ needs.preflight.outputs.candidate_sha }}
          if-no-files-found: error
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: db-pro-windows-v${{ needs.preflight.outputs.app_version }}-${{ needs.preflight.outputs.candidate_sha }}
          if-no-files-found: error
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: db-pro-linux-v${{ needs.preflight.outputs.app_version }}-${{ needs.preflight.outputs.candidate_sha }}
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
