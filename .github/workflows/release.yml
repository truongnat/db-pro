name: Release Build

# The shipped application is the native egui binary `db-pro-native`
# (crates/native-app). The legacy React/Vite frontend and the Tauri bundler
# path were removed when the frontend was archived — see _archive/README.md.
#
# v0.1 packaging contract (V01-06): portable archives plus SHA256SUMS.txt, with
# the macOS build wrapped in a minimal "DB Pro.app" bundle. Installers (DMG,
# MSI/NSIS, DEB/RPM/AppImage), macOS x64 / universal builds, and code signing
# and notarization are explicitly DEFERRED and not part of the v0.1 contract;
# see docs/release/0.1.0-packaging.md and docs/release/evidence/v01-06/.
#
# Release artifacts (exact names, produced by the package + checksums jobs):
#   db-pro-v<version>-macos-arm64.tar.gz    -> "DB Pro.app" + README-INSTALL.txt
#   db-pro-v<version>-windows-x86_64.zip    -> db-pro-native.exe + README-INSTALL.txt
#   db-pro-v<version>-linux-x86_64.tar.gz   -> db-pro-native + README-INSTALL.txt
#   SHA256SUMS.txt                          -> SHA-256 of those three archives
#
# This workflow builds and packages only. It runs with `contents: read`, uses no
# secrets, creates no GitHub Release and pushes no tag.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Exact release source: tag, branch/ref, or commit SHA"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  APP_NAME: "DB Pro"

jobs:
  resolve:
    name: Resolve release candidate
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.identity.outputs.candidate_sha }}
      short_sha: ${{ steps.identity.outputs.short_sha }}
      app_version: ${{ steps.identity.outputs.app_version }}
      source_ref: ${{ steps.identity.outputs.source_ref }}
      source_kind: ${{ steps.identity.outputs.source_kind }}
    steps:
      - name: Checkout workflow source for ref resolution
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve requested ref to exact commit
        id: resolve
        shell: bash
        env:
          MANUAL_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            requested_ref="${MANUAL_REF}"
            if [[ -z "${requested_ref}" ]]; then
              echo "::error::workflow_dispatch requires an exact tag, branch/ref, or commit SHA"
              exit 1
            fi

            source_kind="commit"
            source_ref="${requested_ref}"

            if [[ "${requested_ref}" == refs/tags/* ]]; then
              source_kind="tag"
              source_ref="${requested_ref}"
              candidate_sha="$(git rev-parse --verify "${requested_ref}^{commit}")"
            elif [[ "${requested_ref}" == refs/heads/* ]]; then
              source_kind="branch"
              source_ref="${requested_ref}"
              remote_ref="refs/remotes/origin/${requested_ref#refs/heads/}"
              candidate_sha="$(git rev-parse --verify "${remote_ref}^{commit}")"
            elif git show-ref --verify --quiet "refs/tags/${requested_ref}"; then
              if git show-ref --verify --quiet "refs/remotes/origin/${requested_ref}"; then
                echo "::error::Ref '${requested_ref}' is ambiguous; use refs/tags/${requested_ref} or refs/heads/${requested_ref}"
                exit 1
              fi
              source_kind="tag"
              source_ref="refs/tags/${requested_ref}"
              candidate_sha="$(git rev-parse --verify "refs/tags/${requested_ref}^{commit}")"
            elif git show-ref --verify --quiet "refs/remotes/origin/${requested_ref}"; then
              source_kind="branch"
              source_ref="refs/heads/${requested_ref}"
              candidate_sha="$(git rev-parse --verify "refs/remotes/origin/${requested_ref}^{commit}")"
            else
              candidate_sha="$(git rev-parse --verify "${requested_ref}^{commit}")"
            fi
          else
            source_kind="tag"
            source_ref="${GITHUB_REF}"
            candidate_sha="$(git rev-parse --verify "${GITHUB_SHA}^{commit}")"
          fi

          if [[ ! "${candidate_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Resolved candidate is not a 40-character commit SHA: ${candidate_sha}"
            exit 1
          fi

          echo "candidate_sha=${candidate_sha}" >> "${GITHUB_OUTPUT}"
          echo "source_ref=${source_ref}" >> "${GITHUB_OUTPUT}"
          echo "source_kind=${source_kind}" >> "${GITHUB_OUTPUT}"
          echo "Resolved ${source_ref} -> ${candidate_sha}"

      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.candidate_sha }}
          fetch-depth: 0

      - name: Record immutable release identity
        id: identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.resolve.outputs.candidate_sha }}
          SOURCE_REF: ${{ steps.resolve.outputs.source_ref }}
          SOURCE_KIND: ${{ steps.resolve.outputs.source_kind }}
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "::error::Checkout SHA mismatch: expected ${EXPECTED_SHA}, got ${actual_sha}"
            exit 1
          fi

          app_version="$(python3 -c 'import re,pathlib; text=pathlib.Path("crates/native-app/Cargo.toml").read_text(); match=re.search(r"^version\s*=\s*\"([^\"]+)\"", text, re.M); print(match.group(1) if match else "")')"
          if [[ -z "${app_version}" ]]; then
            echo "::error::Unable to resolve app version from crates/native-app/Cargo.toml"
            exit 1
          fi

          if [[ "${SOURCE_KIND}" == "tag" ]]; then
            tag_name="${SOURCE_REF#refs/tags/}"
            if [[ "${tag_name}" == v* && "${tag_name#v}" != "${app_version}" ]]; then
              echo "::error::Release tag ${tag_name} does not match source app version ${app_version}"
              exit 1
            fi
          fi

          short_sha="${actual_sha:0:12}"
          echo "candidate_sha=${actual_sha}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "app_version=${app_version}" >> "${GITHUB_OUTPUT}"
          echo "source_ref=${SOURCE_REF}" >> "${GITHUB_OUTPUT}"
          echo "source_kind=${SOURCE_KIND}" >> "${GITHUB_OUTPUT}"

          echo "Release candidate:"
          echo "  source: ${SOURCE_REF}"
          echo "  kind: ${SOURCE_KIND}"
          echo "  version: ${app_version}"
          echo "  sha: ${actual_sha}"

  preflight:
    name: Pre-flight checks
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}

      - name: Verify candidate SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${EXPECTED_SHA}"
          echo "Preflight candidate SHA: ${actual_sha}"

      # libdbus-1-dev/pkg-config are named even though this list already reaches them
      # transitively (libgtk-3-dev -> libatk-bridge2.0-dev -> libatspi2.0-dev ->
      # libdbus-1-dev): the keyring credential backend (dbus-secret-service -> dbus ->
      # libdbus-sys) needs the `dbus-1.pc` that libdbus-1-dev provides, and a gate must
      # not depend on an undeclared transitive pull. See
      # docs/release/evidence/v01-06/11-linux-build-dependency-fix.txt.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            libdbus-1-dev pkg-config

      # Reproducibility (goal-3 §15): the release must compile with the exact
      # compiler it was qualified on. rust-toolchain.toml in the checked-out
      # candidate is the single source of truth — no second copy of the version
      # is hard-coded here. A non-exact pin, or an active rustc that does not
      # match it, fails the job instead of silently falling back to the runner's
      # floating `stable`.
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail

          pinned_channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          if [[ -z "${pinned_channel}" ]]; then
            echo "::error::rust-toolchain.toml does not declare a toolchain channel"
            exit 1
          fi
          if [[ ! "${pinned_channel}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::rust-toolchain.toml channel '${pinned_channel}' is not an exact version pin; a release must not build with a floating toolchain"
            exit 1
          fi

          rustup toolchain install "${pinned_channel}" \
            --profile minimal \
            --component rustfmt \
            --component clippy
          rustup default "${pinned_channel}"

          rustup show active-toolchain
          rustc --version --verbose
          cargo clippy --version

          active_version="$(rustc --version | awk '{print $2}')"
          if [[ "${active_version}" != "${pinned_channel}" ]]; then
            echo "::error::Active rustc ${active_version} does not match pin ${pinned_channel} from rust-toolchain.toml"
            exit 1
          fi
          echo "Pinned toolchain active: rustc ${active_version}"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      - name: Write release provenance
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
          SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
          APP_VERSION: ${{ needs.resolve.outputs.app_version }}
          SOURCE_REF: ${{ needs.resolve.outputs.source_ref }}
          SOURCE_KIND: ${{ needs.resolve.outputs.source_kind }}
        run: |
          set -euo pipefail
          export RUSTC_VERSION="$(rustc --version)"
          python3 - <<'PY'
          import json
          import os

          provenance = {
              "version": os.environ["APP_VERSION"],
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "short_sha": os.environ["SHORT_SHA"],
              "source_ref": os.environ["SOURCE_REF"],
              "source_kind": os.environ["SOURCE_KIND"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "rustc": os.environ["RUSTC_VERSION"],
              "binary": "db-pro-native",
          }
          with open("release-provenance.json", "w", encoding="utf-8") as handle:
              json.dump(provenance, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
          cat release-provenance.json

      - name: Upload provenance
        uses: actions/upload-artifact@v4
        with:
          name: db-pro-provenance-v${{ needs.resolve.outputs.app_version }}-${{ needs.resolve.outputs.short_sha }}
          path: release-provenance.json
          if-no-files-found: error

  build:
    name: Build (${{ matrix.platform }})
    needs:
      - resolve
      - preflight
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # The macOS runner is pinned to macos-14 (Apple Silicon) so the produced
      # architecture is deterministic; `macos-latest` is a moving label. Keep
      # this matrix in sync with the package job matrix below.
      matrix:
        include:
          - platform: macOS
            arch_label: macos-arm64
            runner: macos-14
            binary_path: target/release/db-pro-native
          - platform: Windows
            arch_label: windows-x86_64
            runner: windows-latest
            binary_path: target/release/db-pro-native.exe
          - platform: Linux
            arch_label: linux-x86_64
            runner: ubuntu-latest
            binary_path: target/release/db-pro-native

    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}

      - name: Verify and report candidate SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.candidate_sha }}
          APP_VERSION: ${{ needs.resolve.outputs.app_version }}
          SOURCE_REF: ${{ needs.resolve.outputs.source_ref }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "::error::Build checkout SHA mismatch: expected ${EXPECTED_SHA}, got ${actual_sha}"
            exit 1
          fi
          echo "Building DB Pro v${APP_VERSION} (db-pro-native)"
          echo "Source ref: ${SOURCE_REF}"
          echo "Candidate SHA: ${actual_sha}"

      # Reproducibility (goal-3 §15): identical pin resolution to the preflight
      # job, so the artifact is built by the same compiler the release was
      # qualified on. See the preflight step for the rationale.
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail

          pinned_channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          if [[ -z "${pinned_channel}" ]]; then
            echo "::error::rust-toolchain.toml does not declare a toolchain channel"
            exit 1
          fi
          if [[ ! "${pinned_channel}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::rust-toolchain.toml channel '${pinned_channel}' is not an exact version pin; a release must not build with a floating toolchain"
            exit 1
          fi

          rustup toolchain install "${pinned_channel}" \
            --profile minimal \
            --component rustfmt \
            --component clippy
          rustup default "${pinned_channel}"

          rustup show active-toolchain
          rustc --version --verbose
          cargo clippy --version

          active_version="$(rustc --version | awk '{print $2}')"
          if [[ "${active_version}" != "${pinned_channel}" ]]; then
            echo "::error::Active rustc ${active_version} does not match pin ${pinned_channel} from rust-toolchain.toml"
            exit 1
          fi
          echo "Pinned toolchain active: rustc ${active_version}"

      - name: Report Rust toolchain
        shell: bash
        run: rustc --version --verbose

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Only what `-p db-pro-native` actually compiles: the GL/X11/Wayland headers for
      # eframe/egui (libgl1-mesa-dev also pulls libglvnd-dev -> libegl-dev, which
      # glutin_egl_sys links against) plus libdbus-1-dev/pkg-config for the keyring
      # credential backend (dbus-secret-service -> dbus -> libdbus-sys needs `dbus-1.pc`;
      # without it the build panics in libdbus-sys's build script — release run
      # 34847235273, job `Build (Linux)`). The WebKit/GTK headers are NOT needed here
      # because this job does not build the legacy crates/tauri-app, so the preflight
      # job's larger list must not be relied on. See
      # docs/release/evidence/v01-06/11-linux-build-dependency-fix.txt.
      - name: Install Linux system deps
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev \
            libdbus-1-dev pkg-config

      - name: Build native app
        run: cargo build --release --locked -p db-pro-native

      - name: Verify artifact exists
        shell: bash
        run: |
          set -euo pipefail
          test -f "${{ matrix.binary_path }}" || {
            echo "::error::Expected binary not found at ${{ matrix.binary_path }}"
            exit 1
          }
          ls -lh "${{ matrix.binary_path }}"

      # Intermediate artifact: the package job consumes it and produces the
      # versioned release archive. It is not part of the v0.1 release contract,
      # which is why it is named after the binary rather than the product.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: db-pro-native-${{ matrix.arch_label }}-v${{ needs.resolve.outputs.app_version }}-${{ needs.resolve.outputs.short_sha }}
          path: ${{ matrix.binary_path }}
          if-no-files-found: error
          retention-days: 30

  package:
    name: Package (${{ matrix.platform }})
    needs:
      - resolve
      - build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # Mirrors the build job matrix. Each entry turns the binary built for that
      # platform into the v0.1 release archive using scripts/release/*.
      matrix:
        include:
          - platform: macOS
            arch_label: macos-arm64
            runner: macos-14
            archive_ext: tar.gz
            binary_name: db-pro-native
          - platform: Windows
            arch_label: windows-x86_64
            runner: windows-latest
            archive_ext: zip
            binary_name: db-pro-native.exe
          - platform: Linux
            arch_label: linux-x86_64
            runner: ubuntu-latest
            archive_ext: tar.gz
            binary_name: db-pro-native

    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: db-pro-native-${{ matrix.arch_label }}-v${{ needs.resolve.outputs.app_version }}-${{ needs.resolve.outputs.short_sha }}
          path: build-output

      - name: Prepare release binary
        if: matrix.platform != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          binary="build-output/${{ matrix.binary_name }}"
          test -f "${binary}" || {
            echo "::error::Downloaded binary not found at ${binary}"
            exit 1
          }
          # actions/upload-artifact@v4 does not preserve the executable bit.
          chmod 755 "${binary}"
          ls -lh "${binary}"

      - name: Verify target architecture (macOS)
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          archs="$(lipo -archs "build-output/${{ matrix.binary_name }}")"
          echo "Mach-O architectures: ${archs}"
          if [[ "${archs}" != "arm64" ]]; then
            echo "::error::macOS release artifact expects a thin arm64 binary, got '${archs}'"
            exit 1
          fi

      - name: Verify target architecture (Linux)
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          binary="build-output/${{ matrix.binary_name }}"
          file "${binary}"
          if ! file "${binary}" | grep -q "x86-64"; then
            echo "::error::Linux release artifact expects an x86-64 ELF binary"
            exit 1
          fi

      - name: Verify target architecture (Windows)
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $binary = "build-output/${{ matrix.binary_name }}"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "downloaded binary not found: $binary"
          }
          $bytes = [System.IO.File]::ReadAllBytes($binary)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "not a PE image: $binary"
          }
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [System.BitConverter]::ToUInt16($bytes, $peOffset + 4)
          Write-Host ("PE machine type: 0x{0:X4}" -f $machine)
          if ($machine -ne 0x8664) {
            throw ("expected x86-64 (0x8664), got 0x{0:X4}" -f $machine)
          }

      - name: Package archive (macOS)
        if: matrix.platform == 'macOS'
        shell: bash
        env:
          APP_VERSION: ${{ needs.resolve.outputs.app_version }}
        run: |
          set -euo pipefail
          archive="$(bash scripts/release/package-macos.sh "${APP_VERSION}" "build-output/${{ matrix.binary_name }}" dist)"
          test -f "${archive}"
          echo "ARCHIVE_PATH=${archive}" >> "${GITHUB_ENV}"
          echo "ARCHIVE_NAME=$(basename "${archive}")" >> "${GITHUB_ENV}"

      - name: Package archive (Linux)
        if: matrix.platform == 'Linux'
        shell: bash
        env:
          APP_VERSION: ${{ needs.resolve.outputs.app_version }}
        run: |
          set -euo pipefail
          archive="$(bash scripts/release/package-linux.sh "${APP_VERSION}" "build-output/${{ matrix.binary_name }}" dist)"
          test -f "${archive}"
          echo "ARCHIVE_PATH=${archive}" >> "${GITHUB_ENV}"
          echo "ARCHIVE_NAME=$(basename "${archive}")" >> "${GITHUB_ENV}"

      - name: Package archive (Windows)
        if: matrix.platform == 'Windows'
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.resolve.outputs.app_version }}
        run: |
          $archive = & ./scripts/release/package-windows.ps1 `
            -Version $env:APP_VERSION `
            -BinaryPath "build-output/${{ matrix.binary_name }}" `
            -OutputDir "dist"
          if (-not $archive) { throw "packaging script did not return an archive path" }
          "ARCHIVE_PATH=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ARCHIVE_NAME=$(Split-Path -Leaf $archive)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Assert archive identity
        shell: bash
        env:
          EXPECTED_NAME: db-pro-v${{ needs.resolve.outputs.app_version }}-${{ matrix.arch_label }}.${{ matrix.archive_ext }}
        run: |
          set -euo pipefail
          if [[ "${ARCHIVE_NAME}" != "${EXPECTED_NAME}" ]]; then
            echo "::error::Archive name '${ARCHIVE_NAME}' does not match the v0.1 contract '${EXPECTED_NAME}'"
            exit 1
          fi
          echo "Release archive: ${ARCHIVE_NAME}"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_PATH }}
          if-no-files-found: error
          retention-days: 30

  checksums:
    name: Assemble SHA256SUMS
    needs:
      - resolve
      - package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}

      - name: Download packaged archives
        uses: actions/download-artifact@v4
        with:
          pattern: db-pro-v${{ needs.resolve.outputs.app_version }}-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        env:
          APP_VERSION: ${{ needs.resolve.outputs.app_version }}
        run: |
          set -euo pipefail
          ls -l dist
          bash scripts/release/write-checksums.sh "${APP_VERSION}" dist dist/SHA256SUMS.txt

      - name: Upload SHA256SUMS.txt
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS.txt
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
