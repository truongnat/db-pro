name: Gemini Review Council

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gemini-security:
    name: Gemini Security Review
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gemini Security Review
        uses: google-github-actions/run-gemini-cli@v1
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            You are a security-focused reviewer for DB Pro, a desktop Database IDE.

            Review this PR diff with focus on:
            - SQL injection vectors (identifier/literal concatenation)
            - Safety policy bypass
            - Authentication/authorization gaps
            - Input validation at trust boundaries
            - Secret/credential exposure
            - Command injection via Tauri commands
            - XSS in frontend error handling

            Read REVIEW.md for severity definitions and DB-specific review questions.

            For each finding provide:
            - Severity (P0/P1/P2)
            - File and line reference
            - Concrete attack scenario
            - Suggested fix

            Do not report style issues.
            Do not agree with findings from other reviewers without independent evidence.

  gemini-correctness:
    name: Gemini Correctness Review
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gemini Correctness Review
        uses: google-github-actions/run-gemini-cli@v1
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            You are a database correctness reviewer for DB Pro, a desktop Database IDE.

            Review this PR diff with focus on:
            - Transaction atomicity (what happens if statement N fails?)
            - PostgreSQL vs SQLite behavioral differences
            - affectedRows contract (0 != success)
            - Precision/data loss (BIGINT, NUMERIC, coercion)
            - Stale cache/state after mutations
            - NULL handling edge cases
            - Quoted identifier correctness
            - Rollback behavior under failure
            - Race conditions with concurrent sessions

            Read REVIEW.md for severity definitions and the 10-point DB review checklist.

            For each finding provide:
            - Severity (P0/P1/P2)
            - File and line reference
            - Concrete failure scenario
            - Suggested fix

            Do not report style issues.
            Do not agree with findings from other reviewers without independent evidence.
            Source reasoning is not runtime evidence — flag untested claims.
