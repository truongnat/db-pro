[package]
name = "db-pro-native"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "db-pro-native"
path = "src/main.rs"

[dependencies]
db-pro-core = { path = "../core" }
db-pro-ui = { path = "../ui" }
db-pro-runtime = { path = "../runtime" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
tokio.workspace = true
rfd = "0.15"
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
