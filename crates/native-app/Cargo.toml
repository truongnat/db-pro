[package]
name = "db-pro-native"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "db-pro-native"
path = "src/main.rs"

[features]
# Enables the deterministic UI evidence capture driver (`src/capture.rs`), which
# writes a real framebuffer PNG after the layout has settled. This is how the
# acceptance evidence required by `docs/10-egui-native-migration-plan.md` is
# collected on a host where `screencapture` is blocked by TCC. Off by default so
# no shipped binary carries the driver or the encoder.
capture = ["dep:image"]

[dependencies]
db-pro-core = { path = "../core" }
db-pro-ui = { path = "../ui" }
db-pro-runtime = { path = "../runtime" }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
# Already in the lock file as an `eframe` dependency, so `--locked --offline` works.
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
tokio.workspace = true
rfd = "0.15"
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rusqlite.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Native macOS menu bar used by the eframe app.
muda = { version = "0.20", default-features = false }
# Reads the system clipboard for menu-triggered Paste (already in the lock
# file as an eframe dependency). default-features off: text only, skips the
# image-data feature's extra image/graphics crates.
arboard = { version = "3.6", default-features = false }
