  debug_stepping_note: "브레이크포인트, 스테핑, 변수 워치는 #252에서 계획되어 있으며 아직 구현되지 않았습니다 — 이 빌드는 안전한 타입화 실행만 제공합니다."
  debug_production_warning: "디버그는 개발 환경용 워크플로입니다. 이 연결은 %{environment}(으)로 표시되어 있습니다. 개발 서버를 사용하고 운영 데이터를 디버그 세션에 포함하지 마십시오."
