[package]
name = "db-pro-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
db-pro-core = { path = "../core" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
egui = { version = "0.29", features = ["accesskit"] }
serde.workspace = true
serde_json.workspace = true
sqlparser = "0.52"
lucide-icons.workspace = true
bigdecimal.workspace = true
uuid.workspace = true
chrono.workspace = true
rand.workspace = true
tracing.workspace = true
rust-i18n.workspace = true
rs-ui-runtime = {
    package = "ui-runtime",
    git = "https://github.com/truongnat/rs-ui",
    rev = "f6e798d6cfa966b5344cf6a9de6c634563258eec",
}
rs-ui-core = {
    package = "ui-core",
    git = "https://github.com/truongnat/rs-ui",
    rev = "f6e798d6cfa966b5344cf6a9de6c634563258eec",
}

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "result_grid_benchmarks"
harness = false
